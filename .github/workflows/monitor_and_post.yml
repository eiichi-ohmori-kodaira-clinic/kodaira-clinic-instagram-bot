name: Monitor and Post to Instagram

on:
  schedule:
    # 毎日 午前6:00 (JST) = UTC 21:00 (前日) に実行
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor_and_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Japanese Fonts (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Prepare Images and Captions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py prepare

      - name: Step 2 - Commit and Push Generated Images
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add post_news.jpg post_sugar.jpg pending_posts.json execution_log.txt 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: deploy generated post images [skip ci]" && git pull --rebase origin main && git push)

      - name: Step 3 - Publish to Instagram via Meta Graph API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python main.py publish

      - name: Step 4 - Commit and Push State & Posted URLs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_hashes.json posted_urls.json execution_log.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update state and execution logs [skip ci]" && git pull --rebase origin main && git push)
